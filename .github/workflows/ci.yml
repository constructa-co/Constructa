name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Report dependency vulnerabilities
        continue-on-error: true
        run: npm audit --audit-level=critical
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Verify cost library SQL security boundary
        run: npm run test:cost-library-sql
      - name: Verify legacy definer SQL security boundary
        run: npm run test:definer-sql
      - name: Verify organization membership SQL security boundary
        run: npm run test:organization-sql
      - name: Verify Phase 1 Data API grant boundary
        run: npm run test:phase1-grants-sql
      - name: Verify proposal publication SQL security boundary
        run: npm run test:proposal-sql
      - name: Verify proposal non-binding response SQL boundary
        run: npm run test:proposal-response-sql
      - name: Verify supervisor token SQL security boundary
        run: npm run test:supervisor-sql
      - name: Verify Storage tenant boundary
        run: npm run test:storage-sql
      - name: Verify company import draft isolation
        run: npm run test:company-import-sql
      - name: Verify company interview answer and draft isolation
        run: npm run test:company-interview-sql
      - name: Verify AI usage budget for profile rewrite and interview wording
        run: npm run test:ai-budget-sql
      - name: Verify an AI-worded draft needs a budgeted attempt
        run: npm run test:company-narrative-ai-sql
      - run: npm run build

  # The company-website import, in a real browser, with no database: the real
  # screen and server code over an in-memory database and a made-up website.
  import-fixture-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Website import fixture run (desktop, phone, keyboard)
        run: npm run e2e:import-fixture
      - name: Keep the results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: import-fixture-results
          retention-days: 7
          if-no-files-found: ignore
          path: |
            test-results/import-fixture/**/*.json
            test-results/import-fixture/**/*.png
