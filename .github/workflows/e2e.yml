name: E2E

# The Phase 1 browser journey against the disposable Supabase project.
#
# This job needs four repository settings. Until they exist it fails with
# "E2E CONFIGURATION FAILURE", which is a configuration result and never a
# product pass:
#   variable  E2E_SUPABASE_PROJECT_REF       the disposable project reference
#   secret    E2E_SUPABASE_URL
#   secret    E2E_SUPABASE_ANON_KEY
#   secret    E2E_SUPABASE_SERVICE_ROLE_KEY
# The harness refuses any value that does not belong to the approved
# disposable project (e2e/support/env.ts).

on:
  pull_request:
  workflow_dispatch:
    inputs:
      verified_isolated_target:
        description: Confirm a separately authorised, freshly verified isolated target (never production)
        type: boolean
        default: false
      verified_isolated_project_ref:
        description: Public project reference of that verified isolated target
        type: string
        default: ""
      evidence:
        description: Run the full viewport matrix with evidence capture
        type: boolean
        default: false

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-isolated-target:
    # Pull requests (draft or ready) NEVER opt into hosted writes. A manual
    # run needs fresh operator verification AND the existing fail-closed
    # configuration checks before the hosted job can even start.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verified_isolated_target == true && inputs.verified_isolated_project_ref != '' && vars.E2E_SUPABASE_PROJECT_REF != '' && inputs.verified_isolated_project_ref == vars.E2E_SUPABASE_PROJECT_REF }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      verified: ${{ steps.configuration.outcome == 'success' }}
    env:
      E2E_SUPABASE_PROJECT_REF: ${{ vars.E2E_SUPABASE_PROJECT_REF }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      E2E_BRIEF_AI_MODE: disabled
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Discovery loads readE2EEnv: approved ref, URL, JWT roles/ref and
      # loopback app target, without launching a browser or writing data.
      - name: Verify isolated configuration without hosted writes
        id: configuration
        continue-on-error: true
        run: npx playwright test --list

  hosted-write-status:
    needs: verify-isolated-target
    if: ${{ always() && needs.verify-isolated-target.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Report hosted phase1 SKIPPED (not PASS)
        run: |
          echo 'Hosted Phase 1 journey: SKIPPED, not PASS. No hosted signup/data-write smoke ran. A separately authorised manual run must explicitly identify a freshly verified isolated target and pass the existing configuration guard.' >> "$GITHUB_STEP_SUMMARY"

  phase1:
    needs: verify-isolated-target
    if: ${{ needs.verify-isolated-target.outputs.verified == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_SUPABASE_PROJECT_REF: ${{ vars.E2E_SUPABASE_PROJECT_REF }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      # Which state the disposable project is in for the Brief's AI suggestion.
      # It does not switch anything on. This branch ships the feature off, and
      # the run stops before creating an account if the project says otherwise
      # or is missing the AI budget's migrations (e2e/support/brief-ai-mode.ts).
      E2E_BRIEF_AI_MODE: disabled
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Loads the configuration only. Missing or unsafe settings stop here
      # with a message that says so, before anything is built or run.
      - name: Check the E2E configuration
        run: npx playwright test --list
      # Uses the Chrome already on the runner. No browser is downloaded.
      - name: Phase 1 smoke (desktop and phone)
        if: ${{ !inputs.evidence }}
        run: npm run e2e:smoke
      - name: Phase 1 evidence run (desktop, tablet, phone, keyboard)
        if: ${{ inputs.evidence }}
        run: npm run e2e:evidence
      # Results and failure screenshots only. Traces are left on the runner:
      # they record the synthetic session and are not published.
      - name: Keep the results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: phase1-e2e-results
          retention-days: 7
          if-no-files-found: ignore
          path: |
            test-results/report.json
            test-results/phase1/*.json
            test-results/**/*.png
            docs/evidence/stage2-tranche-2f/results-*.json
