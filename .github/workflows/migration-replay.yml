name: Supabase migration replay

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/migration-replay.yml"
      - "scripts/verify-migration-replay-blocker.sh"
      - "supabase/migrations/**"

permissions:
  contents: read

jobs:
  clean-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          # Match the CLI version recorded by the linked Constructa checkout.
          version: 2.84.2
      - name: Initialise local Supabase configuration
        run: |
          if [[ ! -f supabase/config.toml ]]; then
            supabase init
          fi
      - name: Prove the current first clean-replay blocker
        run: bash scripts/verify-migration-replay-blocker.sh
