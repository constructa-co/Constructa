name: Supabase migration replay

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/migration-replay.yml"
      - "scripts/ci-replay-in-container.sh"
      - "scripts/fixtures/supabase-storage.sql"
      - "scripts/test-replay-bootstrap.sh"
      - "scripts/verify-phase1-smoke.sql"
      - "scripts/verify-migration-replay.sh"
      - "supabase/migrations/**"

permissions:
  contents: read

jobs:
  clean-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: supabase/postgres@sha256:edb20149b36e92c915f13b24ae04fed35e6e0a19a6bd6e06d54ed4afbce5c931
        env:
          POSTGRES_USER: supabase_admin
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: constructa_replay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supabase_admin -d constructa_replay"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      # The pinned Postgres image already holds a psql of the server's own
      # version, so the client is not installed from a package mirror. The
      # replay and smoke scripts are unchanged and run in that container
      # against the same localhost database. See scripts/ci-replay-in-container.sh.
      - name: Check the replay bootstrap
        run: bash scripts/test-replay-bootstrap.sh
      - name: Prepare the replay workspace in the Postgres container
        env:
          REPLAY_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          REPLAY_EXPECTED_PG_MAJOR: "17"
          MIGRATION_DATABASE_URL: postgresql://supabase_admin:postgres@localhost:5432/constructa_replay
        run: bash scripts/ci-replay-in-container.sh prepare
      - name: Replay all committed migrations in order
        env:
          REPLAY_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          MIGRATION_DATABASE_URL: postgresql://supabase_admin:postgres@localhost:5432/constructa_replay
        run: bash scripts/ci-replay-in-container.sh replay
      - name: Verify Phase 1 database smoke journey
        env:
          REPLAY_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          MIGRATION_DATABASE_URL: postgresql://supabase_admin:postgres@localhost:5432/constructa_replay
        run: bash scripts/ci-replay-in-container.sh smoke
